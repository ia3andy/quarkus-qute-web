{@io.quarkiverse.qute.web.image.runtime.model.ImageTag image}
{@java.lang.String imgAttrs}
{@java.lang.String pictureAttrs}
{#if image.isDirectUrl}
{image.directUrl}
{#else if image.isPicture}
<picture {pictureAttrs}>
  {#for s in image.sources}
  <source srcset="{s.srcset}" type="{s.type}">
  {/for}
  <img src="{image.imgSrc}" {imgAttrs}>
</picture>
{#else}
<img src="{image.imgSrc}"
  {#if image.hasImgSrcset}srcset="{image.imgSrcset}"{/if} {imgAttrs}>
{/if}
